<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><script src="./image-slot.js"></script></helmet>
<div style="height:100%;min-height:780px;box-sizing:border-box;padding:60px 0 30px;background:#FFFFFF;font-family:Poppins,system-ui,sans-serif;color:#171512;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="padding:6px 20px 0;display:flex;align-items:flex-start;justify-content:space-between">
    <div style="display:flex;flex-direction:column;gap:3px">
      <div style="font-size:23px;font-weight:600;letter-spacing:-0.3px">Menu</div>
      <div style="font-size:12.5px;color:#736E64">64 dishes · 7 categories</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;background:#E4F1EA;border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:500;color:#075C36">Live now</div>
  </div>

  <div style="display:flex;gap:8px;padding:16px 20px 0;overflow:hidden">
    <div style="padding:7px 13px;border-radius:999px;background:#171512;color:#fff;font-size:12px;font-weight:500;white-space:nowrap">Starters</div>
    <div style="padding:7px 13px;border-radius:999px;background:#FAF8F2;color:#736E64;font-size:12px;font-weight:500;white-space:nowrap">Mains</div>
    <div style="padding:7px 13px;border-radius:999px;background:#FAF8F2;color:#736E64;font-size:12px;font-weight:500;white-space:nowrap">Breads</div>
    <div style="padding:7px 13px;border-radius:999px;background:#FAF8F2;color:#736E64;font-size:12px;font-weight:500;white-space:nowrap">Sweets</div>
  </div>

  <div style="padding:16px 20px 0;display:flex;flex-direction:column;gap:9px">

    <div style="background:#FAF8F2;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;opacity:{{ oA }}">
      <div style="width:84px;height:84px;flex:none;border-radius:12px;overflow:hidden"><image-slot id="menu-dish-1" shape="rounded" radius="12" placeholder="Dish"></image-slot></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
        <div style="font-size:14px;font-weight:500">Paneer Tikka</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:600">₹320</div>
          <div style="font-size:10px;color:#097B45;border:1px solid rgba(9,123,69,.35);border-radius:4px;padding:1px 5px">Veg</div>
          <div style="font-size:10.5px;color:#8C877C;white-space:nowrap">{{ sA }}</div>
        </div>
      </div>
      <div data-k="A" onClick="{{ toggle }}" style="cursor:pointer;width:42px;height:24px;border-radius:99px;background:{{ bA }};padding:3px;box-sizing:border-box;display:flex;transition:background .2s;flex:none"><div style="width:18px;height:18px;border-radius:99px;background:#fff;transform:{{ xA }};transition:transform .2s"></div></div>
    </div>

    <div style="background:#FAF8F2;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;opacity:{{ oB }}">
      <div style="width:84px;height:84px;flex:none;border-radius:12px;overflow:hidden"><image-slot id="menu-dish-2" shape="rounded" radius="12" placeholder="Dish"></image-slot></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
        <div style="font-size:14px;font-weight:500">Tandoori Platter</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:600">₹480</div>
          <div style="font-size:10px;color:#C4552F;border:1px solid rgba(196,85,47,.35);border-radius:4px;padding:1px 5px">Non-veg</div>
          <div style="font-size:10.5px;color:#8C877C;white-space:nowrap">{{ sB }}</div>
        </div>
      </div>
      <div data-k="B" onClick="{{ toggle }}" style="cursor:pointer;width:42px;height:24px;border-radius:99px;background:{{ bB }};padding:3px;box-sizing:border-box;display:flex;transition:background .2s;flex:none"><div style="width:18px;height:18px;border-radius:99px;background:#fff;transform:{{ xB }};transition:transform .2s"></div></div>
    </div>

    <div style="background:#FAF8F2;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;opacity:{{ oC }}">
      <div style="width:84px;height:84px;flex:none;border-radius:12px;overflow:hidden"><image-slot id="menu-dish-3" shape="rounded" radius="12" placeholder="Dish"></image-slot></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
        <div style="font-size:14px;font-weight:500">Hara Bhara Kebab</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:600">₹260</div>
          <div style="font-size:10px;color:#097B45;border:1px solid rgba(9,123,69,.35);border-radius:4px;padding:1px 5px">Veg</div>
          <div style="font-size:10.5px;color:#8C877C;white-space:nowrap">{{ sC }}</div>
        </div>
      </div>
      <div data-k="C" onClick="{{ toggle }}" style="cursor:pointer;width:42px;height:24px;border-radius:99px;background:{{ bC }};padding:3px;box-sizing:border-box;display:flex;transition:background .2s;flex:none"><div style="width:18px;height:18px;border-radius:99px;background:#fff;transform:{{ xC }};transition:transform .2s"></div></div>
    </div>

    <div style="background:#FAF8F2;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;opacity:{{ oD }}">
      <div style="width:84px;height:84px;flex:none;border-radius:12px;overflow:hidden"><image-slot id="menu-dish-4" shape="rounded" radius="12" placeholder="Dish"></image-slot></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px;min-width:0">
        <div style="font-size:14px;font-weight:500">Chilli Cheese Toast</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:13px;font-weight:600">₹190</div>
          <div style="font-size:10px;color:#097B45;border:1px solid rgba(9,123,69,.35);border-radius:4px;padding:1px 5px">Veg</div>
          <div style="font-size:10.5px;color:#8C877C;white-space:nowrap">{{ sD }}</div>
        </div>
      </div>
      <div data-k="D" onClick="{{ toggle }}" style="cursor:pointer;width:42px;height:24px;border-radius:99px;background:{{ bD }};padding:3px;box-sizing:border-box;display:flex;transition:background .2s;flex:none"><div style="width:18px;height:18px;border-radius:99px;background:#fff;transform:{{ xD }};transition:transform .2s"></div></div>
    </div>
  </div>

  <div style="margin-top:auto;padding:0 20px;display:flex;flex-direction:column;gap:10px">
    <div style="border:1px dashed rgba(23,21,18,.16);border-radius:14px;padding:13px;text-align:center;font-size:12.5px;color:#736E64">+ Add a dish or category</div>
    <div style="display:flex;align-items:center;gap:9px;background:#171512;border-radius:14px;padding:13px 15px;color:#fff">
      <div style="width:7px;height:7px;border-radius:99px;background:#097B45"></div>
      <div style="font-size:12.5px;font-weight:500">{{ savedLabel }}</div>
      <div style="margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.5)">Guests see it now</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874}}">
class Component extends DCLogic {
  state = { stock: { A: true, B: true, C: false, D: true }, saved: 'All changes live' };
  renderVals() {
    const st = this.state.stock;
    const v = {};
    ['A', 'B', 'C', 'D'].forEach((k) => {
      v['b' + k] = st[k] ? '#097B45' : '#DDD9CE';
      v['x' + k] = st[k] ? 'translateX(18px)' : 'translateX(0)';
      v['s' + k] = st[k] ? 'In stock' : 'Out of stock';
      v['o' + k] = st[k] ? '1' : '0.55';
    });
    return {
      ...v,
      savedLabel: this.state.saved,
      toggle: (e) => {
        const k = e.currentTarget.dataset.k;
        this.setState((s) => ({ stock: { ...s.stock, [k]: !s.stock[k] }, saved: 'Saved just now' }));
      },
    };
  }
}
</script>
</body>
</html>
