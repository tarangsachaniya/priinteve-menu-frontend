<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"></helmet>
<div style="height:100%;min-height:780px;box-sizing:border-box;padding:60px 0 30px;background:#FFFFFF;font-family:Poppins,system-ui,sans-serif;color:#171512;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="padding:6px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:3px">
      <div style="font-size:23px;font-weight:600;letter-spacing:-0.3px">Tables &amp; QR</div>
      <div style="font-size:12.5px;color:#736E64;white-space:nowrap">Ruchi Kitchen · 12 tables</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;background:#E4F1EA;border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:500;color:#075C36">
      <div style="width:6px;height:6px;border-radius:99px;background:#097B45"></div>5 active
    </div>
  </div>

  <div style="margin:16px 20px 0;background:#FAF8F2;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:92px;height:92px;border-radius:12px;background:#FAF8F2;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="66" height="66" viewBox="0 0 21 21" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/><g fill="#171512"><rect x="1" y="1" width="5" height="5"/><rect x="2" y="2" width="3" height="3" fill="#fff"/><rect x="3" y="3" width="1" height="1"/><rect x="15" y="1" width="5" height="5"/><rect x="16" y="2" width="3" height="3" fill="#fff"/><rect x="17" y="3" width="1" height="1"/><rect x="1" y="15" width="5" height="5"/><rect x="2" y="16" width="3" height="3" fill="#fff"/><rect x="3" y="17" width="1" height="1"/><rect x="8" y="1" width="1" height="2"/><rect x="10" y="1" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/><rect x="8" y="4" width="2" height="1"/><rect x="11" y="4" width="1" height="1"/><rect x="1" y="8" width="2" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="2" y="10" width="1" height="1"/><rect x="1" y="12" width="1" height="1"/><rect x="4" y="11" width="1" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="11" y="8" width="1" height="1"/><rect x="13" y="9" width="1" height="1"/><rect x="8" y="11" width="1" height="1"/><rect x="10" y="12" width="2" height="1"/><rect x="12" y="10" width="1" height="1"/><rect x="15" y="8" width="1" height="1"/><rect x="17" y="8" width="2" height="1"/><rect x="16" y="10" width="1" height="1"/><rect x="18" y="11" width="1" height="2"/><rect x="15" y="13" width="1" height="1"/><rect x="8" y="15" width="1" height="2"/><rect x="10" y="15" width="2" height="1"/><rect x="12" y="17" width="1" height="1"/><rect x="9" y="18" width="1" height="1"/><rect x="14" y="16" width="2" height="2"/><rect x="17" y="15" width="1" height="1"/><rect x="18" y="18" width="2" height="1"/><rect x="16" y="19" width="1" height="1"/></g></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
        <div style="font-size:16px;font-weight:600">Table {{ sel }} code</div>
        <div style="font-size:11px;color:#736E64;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ruchi.menu/t/{{ selLower }}</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#097B45;font-weight:500">Opens straight into this table's order</div>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <div style="flex:1;text-align:center;padding:13px 0;border-radius:12px;background:#171512;color:#fff;font-size:13.5px;font-weight:500">Print code</div>
      <div style="flex:1;text-align:center;padding:13px 0;border-radius:12px;background:#FAF8F2;color:#171512;font-size:13.5px;font-weight:500">Print all 12</div>
    </div>
  </div>

  <div style="display:flex;gap:8px;padding:16px 20px 0">
    <div style="padding:7px 14px;border-radius:999px;background:#171512;color:#fff;font-size:12px;font-weight:500">Ground floor</div>
    <div style="padding:7px 14px;border-radius:999px;background:#FAF8F2;color:#736E64;font-size:12px;font-weight:500">Terrace</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 0">
    <div data-t="T1" onClick="{{ pick }}" style="cursor:pointer;background:#FAF8F2;border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:15px;font-weight:600">T1</div>
      <div style="font-size:10.5px;color:#736E64">4 seats</div>
      <div style="height:3px;border-radius:9px;background:#E3E0D6"></div>
    </div>
    <div data-t="T2" onClick="{{ pick }}" style="cursor:pointer;background:#FAF8F2;border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:15px;font-weight:600">T2</div>
      <div style="font-size:10.5px;color:#C4552F">Ordering</div>
      <div style="height:3px;border-radius:9px;background:#C4552F"></div>
    </div>
    <div data-t="T3" onClick="{{ pick }}" style="cursor:pointer;background:#FAF8F2;border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:15px;font-weight:600">T3</div>
      <div style="font-size:10.5px;color:#736E64">2 seats</div>
      <div style="height:3px;border-radius:9px;background:#E3E0D6"></div>
    </div>
    <div data-t="T4" onClick="{{ pick }}" style="cursor:pointer;background:#FAF8F2;border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:15px;font-weight:600">T4</div>
      <div style="font-size:10.5px;color:#C4552F">Ordering</div>
      <div style="height:3px;border-radius:9px;background:#C4552F"></div>
    </div>
    <div data-t="T5" onClick="{{ pick }}" style="cursor:pointer;background:#FAF8F2;border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:15px;font-weight:600">T5</div>
      <div style="font-size:10.5px;color:#736E64">6 seats</div>
      <div style="height:3px;border-radius:9px;background:#E3E0D6"></div>
    </div>
    <div data-t="T6" onClick="{{ pick }}" style="cursor:pointer;background:#FAF8F2;border-radius:14px;padding:12px 12px 11px;display:flex;flex-direction:column;gap:9px">
      <div style="font-size:15px;font-weight:600">T6</div>
      <div style="font-size:10.5px;color:#097B45">Paid</div>
      <div style="height:3px;border-radius:9px;background:#097B45"></div>
    </div>
  </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874}}">
class Component extends DCLogic {
  state = { sel: 'T4' };
  renderVals() {
    return {
      sel: this.state.sel,
      selLower: this.state.sel.toLowerCase(),
      pick: (e) => this.setState({ sel: e.currentTarget.dataset.t }),
    };
  }
}
</script>
</body>
</html>
